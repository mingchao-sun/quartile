<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>Quartile</title>
  <style>
    body { font-family: sans-serif; max-width: 680px; margin: 2em auto; line-height: 1.6; }
    h3 { margin: 16px 0 4px; font-size: 15px; color: #1a4f9c; }
    label.row { display: block; padding: 2px 0; }
    select { font-size: 14px; padding: 2px 6px; }
    button { margin-top: 12px; }
    #out { margin-top: 12px; color: #333; }
    .note { color: #666; font-size: 13px; }
    .lang { margin-bottom: 8px; }
  </style>
</head>
<body>
  <p class="lang">
    <label for="lang" data-i18n="lang_label"></label>
    <select id="lang">
      <option value="zh">中文</option>
      <option value="ja">日本語</option>
      <option value="en">English</option>
    </select>
  </p>
  <h2 data-i18n="opt_title"></h2>
  <fieldset>
    <legend data-i18n="names_label"></legend>
    <p class="note" data-i18n="names_help"></p>
    <input type="text" id="names" style="width:100%; box-sizing:border-box; padding:4px">
    <p id="names_out" class="note"></p>
  </fieldset>
  <p class="note"><span data-i18n="opt_intro"></span> <a href="https://github.com/hitfyd/ShowJCR" target="_blank">GitHub</a></p>
  <div id="list"></div>
  <p id="out"></p>
  <button id="clear" data-i18n="opt_clear"></button>
  <script src="i18n.js"></script>
  <script src="tables.js"></script>
  <script src="options.js"></script>
</body>
</html>
